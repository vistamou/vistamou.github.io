<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lexical Lab — Instructor</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="./lab-config.js"></script><style>body{font:16px system-ui;margin:30px auto;padding:0 16px;max-width:1100px;color:#17253b}input,button{padding:10px;margin:4px;border:1px solid #bcccdc;border-radius:7px}button{background:#2059aa;color:white;cursor:pointer}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}small{color:#566}#app{display:none}.cards{display:flex;gap:12px;flex-wrap:wrap}.card{padding:18px;background:#f2f6fc;border-radius:12px;min-width:130px}</style></head><body><a href="./lexical-lab.html">← Lexical Lab</a><h1>Αποτελέσματα τάξης — Instructor</h1><p>Πρόσβαση μόνο με τον λογαριασμό του διδάσκοντα. Οι νέες υποβολές ενημερώνουν την οθόνη.</p><div id="login"><input id="email" type="email" placeholder="Instructor email"><input id="password" type="password" placeholder="Password"><button id="signin">Σύνδεση</button></div><p id="status"></p><main id="app"><div class="cards"><div class="card">Υποβολές: <b id="count">0</b></div><div class="card">Accuracy: <b id="accuracy">—</b></div><div class="card">Mean correct RT: <b id="rt">—</b></div></div><p><button id="export">Εξαγωγή όλων των δοκιμών CSV</button><button id="refresh">Ανανέωση</button><button id="signout">Αποσύνδεση</button></p><div style="overflow-x:auto"><table><thead><tr><th>Time (UTC)</th><th>Experiment</th><th>Participant</th><th>Trials</th><th>Accuracy</th><th>Mean correct RT</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>
const c=window.LDT_CONFIG||{},client=(c.url&&!c.url.includes('YOUR_'))?supabase.createClient(c.url,c.anonKey):null;let data=[];const el=id=>document.getElementById(id);function msg(s){el('status').textContent=s};
function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]))};
function rt(rows){const a=rows.filter(r=>r.correct===1&&Number(r.rt_ms)>=250&&Number(r.rt_ms)<=1500).map(r=>Number(r.rt_ms));return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null}
async function reload(){if(!client)return;const {data:d,error}=await client.from('ldt_submissions').select('id,experiment_id,participant_id,trials,device,created_at').order('created_at',{ascending:false}).limit(1000);if(error){msg(error.message);return}data=d||[];draw();msg('Τελευταία ενημέρωση: '+new Date().toLocaleTimeString('el-GR'))}
function draw(){const all=data.flatMap(s=>s.trials||[]);const correct=all.filter(t=>t.correct===1);el('count').textContent=data.length;el('accuracy').textContent=all.length?Math.round(100*correct.length/all.length)+'%':'—';el('rt').textContent=rt(all)===null?'—':rt(all)+' ms';el('rows').innerHTML=data.map(s=>'<tr><td>'+esc(s.created_at)+'</td><td>'+esc(s.experiment_id.slice(0,8))+'</td><td>'+esc(s.participant_id)+'</td><td>'+s.trials.length+'</td><td>'+Math.round(100*s.trials.filter(t=>t.correct===1).length/s.trials.length)+'%</td><td>'+(rt(s.trials)??'—')+'</td></tr>').join('')}
function csvEscape(v){return '"'+String(v??'').replaceAll('"','""')+'"'};
el('export').onclick=()=>{const records=data.flatMap(s=>(s.trials||[]).map(t=>({...t,submission_id:s.id,experiment_id:s.experiment_id,submitted_at:s.created_at})));const keys=['submission_id','experiment_id','submitted_at','designer_id','participant_id','trial','stimulus','condition','frequency_per_million','response','correct_response','correct','rt_ms','device','timestamp'];const csv='\ufeff'+[keys.join(','),...records.map(x=>keys.map(k=>csvEscape(x[k])).join(','))].join('\r\n');const b=new Blob([csv],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='lexical_lab_class_results.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};
el('signin').onclick=async()=>{if(!client)return msg('Ρύθμισε πρώτα το lab-config.js');const {error}=await client.auth.signInWithPassword({email:el('email').value,password:el('password').value});if(error)msg(error.message);else show()};el('signout').onclick=async()=>{await client.auth.signOut();location.reload()};el('refresh').onclick=reload;
async function show(){const {data:{user}}=await client.auth.getUser();if(!user)return;el('login').style.display='none';el('app').style.display='block';await reload();client.channel('live-results').on('postgres_changes',{event:'INSERT',schema:'public',table:'ldt_submissions'},()=>reload()).subscribe()}
if(!client)msg('Πρέπει να συμπληρώσεις το lab-config.js.');else show();
</script></body></html>
